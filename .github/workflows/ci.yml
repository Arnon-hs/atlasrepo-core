name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run benchmark:dify
      - run: npm run build
      - name: Inspect package JSON
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          npm pack --dry-run --json | jq -e --arg expected "atlasrepo-core-${version}.tgz" '
            length == 1 and
            .[0].filename == $expected and
            (.[0].bundled | sort) == [
              "ajv",
              "ajv-formats",
              "fast-deep-equal",
              "fast-uri",
              "json-schema-traverse",
              "require-from-string"
            ]
          '
      - name: Verify reproducible offline package
        run: npm run package:verify
      - run: npm audit --omit=dev
