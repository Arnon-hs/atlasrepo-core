name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      filename: ${{ steps.package.outputs.filename }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v${version}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run benchmark:dify
      - run: npm audit --omit=dev
      - name: Verify reproducible offline package
        run: npm run package:verify

      - name: Build reproducible package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          first="$(mktemp -d "${RUNNER_TEMP:?}/atlasrepo-core-pack-one.XXXXXX")"
          second="$(mktemp -d "${RUNNER_TEMP:?}/atlasrepo-core-pack-two.XXXXXX")"
          trap 'rm -rf "$first" "$second"' EXIT HUP INT TERM

          name="$(npm pack --json | jq -r '.[0].filename')"
          install -m 0644 "$name" "$first/$name"
          rm -f "$name"
          name_again="$(npm pack --json | jq -r '.[0].filename')"
          test "$name" = "$name_again"
          install -m 0644 "$name_again" "$second/$name"
          cmp "$first/$name" "$second/$name"

          install -d -m 0755 dist-release
          install -m 0644 "$first/$name" "dist-release/$name"
          printf 'filename=%s\n' "$name" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          npm sbom --omit=dev --sbom-format spdx > "dist-release/atlasrepo-core-${version}.spdx.json"
          cd dist-release
          sha256sum * > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Transfer verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist-release/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist-release

      - name: Verify transferred checksums
        working-directory: dist-release
        run: sha256sum --check SHA256SUMS

      - name: Attest release asset provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist-release/SHA256SUMS

      - name: Attest package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist-release/${{ needs.build.outputs.filename }}
          sbom-path: dist-release/atlasrepo-core-${{ needs.build.outputs.version }}.spdx.json

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          test "$GITHUB_REF_NAME" = "v${version}"
          sbom="dist-release/atlasrepo-core-${version}.spdx.json"
          test -f "$sbom"
          gh release create "$GITHUB_REF_NAME" dist-release/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "AtlasRepo Core $GITHUB_REF_NAME"
